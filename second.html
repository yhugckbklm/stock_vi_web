<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Pandas DataFrame Style Table</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px;
  }

  /* สไตล์ตารางเลียนแบบ Pandas DataFrame */
  table.dataframe {
    border-collapse: collapse;
    border: none;
    font-size: 13px;
    color: #000000;
  }

  /* เส้นขอบใต้หัวตาราง */
  table.dataframe thead {
    border-bottom: 1px solid #000000;
    vertical-align: bottom;
  }

  /* สไตล์ช่องหัวตาราง (Column Headers) และแถว Index */
  table.dataframe th {
    font-weight: bold;
    text-align: right;
    padding: 6px 12px;
    border: none;
  }

  /* สไตล์ช่องข้อมูล (Cells) */
  table.dataframe td {
    text-align: right;
    padding: 6px 12px;
    border: none;
    cursor: pointer; /* เปลี่ยนเมาส์เป็นรูปมือ */
    transition: background-color 0.15s ease;
  }

  /* สลับสีแถว (Zebra striping) เหมือน Pandas */
  table.dataframe tbody tr:nth-child(odd) {
    background-color: #f5f5f5;
  }
  table.dataframe tbody tr:nth-child(even) {
    background-color: #ffffff;
  }

  /* สีไฮไลต์เมื่อเอาเมาส์ชี้ (Hover) */
  table.dataframe tbody tr:hover {
    background-color: #e1f5fe !important;
  }

  /* เอฟเฟกต์สีเขียวแวบขึ้นมาตอนคลิกก๊อปปี้สำเร็จ */
  table.dataframe td.copied {
    background-color: #c8e6c9 !important;
    color: #1b5e20;
    font-weight: bold;
  }

  /* กล่องแจ้งเตือน (Toast) มุมขวาล่าง */
  #toast {
    visibility: hidden;
    background-color: #333;
    color: #fff;
    text-align: center;
    border-radius: 6px;
    padding: 10px 18px;
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    z-index: 1000;
  }

  #toast.show {
    visibility: visible;
    animation: fadein 0.3s, fadeout 0.3s 1.7s;
  }

  @keyframes fadein {
    from {bottom: 0; opacity: 0;}
    to {bottom: 20px; opacity: 1;}
  }

  @keyframes fadeout {
    from {bottom: 20px; opacity: 1;}
    to {bottom: 0; opacity: 0;}
  }
</style>
</head>
<body>

<table class="dataframe" id="myDataFrame">
  <thead>
    <tr>
      <th></th>
      <th>Name</th>
      <th>Age</th>
      <th>Department</th>
      <th>Salary</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th>0</th>
      <td>Somchai</td>
      <td>28</td>
      <td>Engineering</td>
      <td>45000</td>
    </tr>
    <tr>
      <th>1</th>
      <td>Somsri</td>
      <td>34</td>
      <td>Marketing</td>
      <td>52000</td>
    </tr>
    <tr>
      <th>2</th>
      <td>Ananda</td>
      <td>25</td>
      <td>Design</td>
      <td>38000</td>
    </tr>
    <tr>
      <th>3</th>
      <td>Nattapong</td>
      <td>41</td>
      <td>Management</td>
      <td>85000</td>
    </tr>
  </tbody>
</table>

<div id="toast">คัดลอกแล้ว!</div>

<script>
  // ดึงช่องข้อมูล <td> ทั้งหมดในตาราง
  const cells = document.querySelectorAll('#myDataFrame td');
  const toast = document.getElementById('toast');

  cells.forEach(cell => {
    cell.addEventListener('click', function() {
      // ดึงข้อความในช่องและตัดช่องว่างหัวท้ายออก
      const textToCopy = this.innerText.trim();

      // สั่งคัดลอกลง Clipboard
      navigator.clipboard.writeText(textToCopy).then(() => {
        
        // 1. เปลี่ยนสีช่องชั่วคราวให้รู้ว่ากดติดแล้ว
        this.classList.add('copied');
        setTimeout(() => {
          this.classList.remove('copied');
        }, 400);

        // 2. แสดงข้อความแจ้งเตือนมุมขวาล่าง
        toast.innerText = `คัดลอก "${textToCopy}" แล้ว`;
        toast.className = "show";
        setTimeout(() => { 
          toast.className = toast.className.replace("show", ""); 
        }, 2000);

      }).catch(err => {
        console.error('ไม่สามารถคัดลอกได้: ', err);
      });
    });
  });
</script>

</body>
</html>
