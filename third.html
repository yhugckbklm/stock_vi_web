<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>ตัวอย่างกล่องค้นหา DaisyUI</title>
  <!-- ดึงสไตล์ของ DaisyUI และ Tailwind CSS -->
  <link href="https://jsdelivr.net" rel="stylesheet" type="text/css" />
  <script src="https://tailwindcss.com"></script>
</head>
<body class="p-10 max-w-lg font-sans">

  <h3 class="text-lg font-bold mb-3">ค้นหาชื่อหุ้นหรือตัวแปร (DaisyUI)</h3>

  <!-- กล่องค้นหา + ปุ่มกด -->
  <div class="join w-full">
    <input class="input input-bordered join-item w-full" placeholder="พิมพ์ชื่อหุ้น เช่น AAPL, MSFT..." />
    <button class="btn btn-primary join-item">ค้นหา</button>
  </div>

</body>
</html>
