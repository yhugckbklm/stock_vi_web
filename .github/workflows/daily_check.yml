name: Daily Stock Scanner YFinance

on:
  push:
    branches:
      - test 
  schedule:
    - cron: '0 0 * * *' # รันอัตโนมัติทุกวันเวลาเที่ยงคืน (00:00 UTC)
  workflow_dispatch: # เปิดให้กดรันมือเองได้

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v3
      with:
        ref: test    

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: | 
        pip install requests yfinance pandas supabase

    - name: Run Scanner Script
      run: python check_new_fs.py
      
