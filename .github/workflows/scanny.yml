name: Daily Stock Scanner YFinance

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: test    

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install requests yfinance pandas edgar streamlit supabase python-dotenv

      - name: Run Scanner Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SECRET_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }} 
        run: python check_new_fs.py
        
