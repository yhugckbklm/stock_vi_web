<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./src/output.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="bg-gray-950 text-gray-100 p-6">
    <div class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <h1 class="text-xl font-bold text-emerald-400">input your stock title</h1>
            
            <input 
                id="tickerInput" 
                type="text" 
                placeholder="MSFT" 
                class="w-full mt-4 bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 text-white uppercase focus:outline-none focus:border-emerald-500"
            >

            <!-- ตั้ง onclick="sendToPython()" เมื่อกดปุ่ม -->
            <button 
                onclick="sendToPython()" 
                class="mt-6 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg transition cursor-pointer"
            > search
            </button>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-bold text-emerald-400 mb-2">Financial Output</h2>
            
            <!-- ตั้ง id="resultBox" เพื่อเอาผลลัพธ์จาก Python มาแปะตรงนี้ -->
            <div id="resultBox" class="mt-4 w-full h-40 bg-gray-950 border border-dashed border-gray-700 rounded-lg p-4 flex items-center justify-center text-gray-500 text-sm">
                search now!
            </div>
        </div>
    </div>
    <script>
        async function sendToPython() {
            const ticker = document.getElementById('tickerInput').value;
            const resultBox = document.getElementById('resultBox');
        
        if (!ticker) {
            alert("please input your stock title");
            return;
        }
        resultBox.innerHTML = '<span class="text-emerald-400">getting data</span>';
        try {
            const response = await fetch('http://127.0.0.1:8000/', {
                method: 'POST',
                headers: {
                    'Content-Type' : 'application/json'
                },
                body: JSON.stringify({ message: ticker})
            });
            const data = await response.json();
            resultBox.innerText = JSON.stringify(data.response_stock_info, null, 2);

        }catch (error) {
            console.error(error);
            resultBox.innerHTML = '<span class="text-red-400">sorry there must be a problem</span>';
        }
        }    
    </script>
</body>
</html>
